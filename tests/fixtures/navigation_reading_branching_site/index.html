<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Navigation Branching Lab</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #142126;
      background: #edf1f2;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #edf1f2; }
    header {
      position: sticky;
      top: 0;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 66px;
      padding: 0 34px;
      border-bottom: 1px solid #bdc9cc;
      background: #fff;
    }
    main { width: min(920px, calc(100% - 44px)); margin: 30px auto 90px; }
    h1 { margin: 0 0 12px; font-size: 34px; }
    .lede { color: #51646b; font-size: 17px; line-height: 1.6; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 28px; }
    .card, article, .update {
      border: 1px solid #bdc9cc;
      border-radius: 6px;
      background: #fff;
      box-shadow: 0 2px 7px rgb(20 33 38 / 8%);
    }
    .card { padding: 22px; }
    .card h2 { min-height: 56px; margin: 0 0 12px; font-size: 21px; }
    article { padding: 36px 46px; }
    article p { font-size: 17px; line-height: 1.75; }
    article h2 { margin-top: 36px; }
    button {
      min-height: 46px;
      padding: 10px 16px;
      border: 1px solid #155d58;
      border-radius: 5px;
      background: #1f7a72;
      color: #fff;
      font: 600 15px "Segoe UI", Arial, sans-serif;
      cursor: pointer;
    }
    button:hover { background: #155d58; }
    .end-marker {
      margin-top: 28px;
      padding: 14px;
      border: 1px solid #6f9f99;
      background: #f1faf8;
      text-align: center;
      font-weight: 700;
    }
    .footer-action { display: flex; justify-content: flex-end; margin-top: 34px; }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 7;
      display: grid;
      place-items: center;
      background: rgb(20 33 38 / 48%);
    }
    .modal {
      width: min(560px, calc(100% - 40px));
      padding: 30px;
      border: 1px solid #8b9a9f;
      border-radius: 6px;
      background: #fff;
      box-shadow: 0 18px 55px rgb(0 0 0 / 25%);
    }
    .updates { display: grid; gap: 14px; }
    .update { min-height: 230px; padding: 24px; }
    .update strong { display: block; margin-bottom: 12px; font-size: 21px; }
    .sticky-action {
      position: fixed;
      right: 30px;
      bottom: 26px;
      z-index: 5;
    }
  </style>
</head>
<body>
  <header>
    <strong>Navigation Branching Lab</strong>
    <span id="stage-label"></span>
  </header>
  <main id="app"></main>
  <script>
    const params = new URLSearchParams(window.location.search);
    const stage = params.get("stage") || "hub";
    const app = document.getElementById("app");
    const stageLabel = document.getElementById("stage-label");
    const go = (next) => { window.location.href = `?stage=${next}`; };
    const reportSections = Array.from({ length: 6 }, (_, index) => `
      <h2>Incident evidence section ${index + 1}</h2>
      <p>Verified observation ${index + 1}: the task controller must preserve semantic
      progress after navigation, resolve every real target from the current capture, and
      record Gate and post-action evidence before continuing.</p>
      <p>Scope note ${index + 1}: a successful dispatch is not accepted as a successful
      scroll unless the target content changes or the explicit bottom is reached.</p>
    `).join("");
    const updates = Array.from({ length: 14 }, (_, index) => `
      <section class="update">
        <strong>Live update ${index + 1}</strong>
        <p>Dynamic collection item ${index + 1}. This item exists to verify bounded
        reading, content fingerprint change, and continuation after stopping the
        collection read without ending the overall task.</p>
      </section>
    `).join("");

    if (stage === "hub") {
      stageLabel.textContent = "Workspace hub";
      app.innerHTML = `
        <h1>Operations Workspace Interface</h1>
        <p class="lede">Review the incident, return here, inspect the policy dialog,
        then open live updates. Completed branches must not be repeated.</p>
        <div class="grid">
          <section class="card">
            <h2>Incident report</h2>
            <button onclick="go('incident')">Open incident report</button>
          </section>
          <section class="card">
            <h2>Policy dialog</h2>
            <button onclick="go('policy')">Open policy dialog</button>
          </section>
          <section class="card">
            <h2>Live updates</h2>
            <button onclick="go('updates')">Open live updates</button>
          </section>
        </div>`;
    } else if (stage === "incident") {
      stageLabel.textContent = "Incident detail";
      app.innerHTML = `
        <article>
          <h1>Incident Report Interface</h1>
          <p class="lede">Finite detail. Read to the explicit end, then return.</p>
          ${reportSections}
          <div class="end-marker">INCIDENT REPORT END</div>
          <div class="footer-action">
            <button onclick="go('hub')">Return to workspace</button>
          </div>
        </article>`;
    } else if (stage === "policy") {
      stageLabel.textContent = "Policy modal";
      app.innerHTML = `
        <h1>Operations Workspace Interface</h1>
        <p class="lede">The workspace remains behind the active modal.</p>
        <div class="modal-backdrop">
          <section class="modal" role="dialog" aria-modal="true">
            <h1>Policy Dialog Interface</h1>
            <p>Read-only policy review. Closing this dialog returns to the workspace.</p>
            <button onclick="go('hub')">Close policy dialog</button>
          </section>
        </div>`;
    } else if (stage === "updates") {
      stageLabel.textContent = "Bounded collection";
      app.innerHTML = `
        <h1>Live Updates Interface</h1>
        <p class="lede">This is an infinite-style collection. Read only the configured
        budget, stop collection reading, then continue the task.</p>
        <div class="updates">${updates}</div>
        <button class="sticky-action" onclick="go('summary')">Open workflow summary</button>`;
    } else if (stage === "summary") {
      stageLabel.textContent = "Summary";
      app.innerHTML = `
        <article>
          <h1>Workflow Summary Interface</h1>
          <p class="lede">The branch, back, modal, and bounded collection path is complete.</p>
          <div class="end-marker">BRANCHING WORKFLOW SAFE STOP</div>
        </article>`;
    }
  </script>
</body>
</html>
