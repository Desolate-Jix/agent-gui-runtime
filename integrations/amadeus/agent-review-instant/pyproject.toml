[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "amadeus-agent-gui-runtime"
version = "0.0.6"
description = "Connector to a separately installed Windows GUI Runtime using authenticated HTTP MCP and a Skill"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "ISC"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/Desolate-Jix/agent-gui-runtime/blob/amadeus-extension-v0.0.6/integrations/amadeus/agent-review-instant/README.md"
Repository = "https://github.com/Desolate-Jix/agent-gui-runtime"

[project.entry-points."amadeus.extensions"]
"io.github.desolate-jix.gui-runtime" = "amadeus_agent_gui"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
amadeus_agent_gui = ["amadeus-extension.json", "skills/gui-execution/SKILL.md", "skills/gui-execution/references/runtime.md"]
