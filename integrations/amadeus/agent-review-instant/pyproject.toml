[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "amadeus-agent-gui-runtime"
version = "0.0.4"
description = "Declarative HTTP MCP connection and Skill for an authenticated local Windows GUI Runtime"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "ISC"
license-files = ["LICENSE"]

[project.entry-points."amadeus.extensions"]
"io.github.desolate-jix.gui-runtime" = "amadeus_agent_gui"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
amadeus_agent_gui = ["amadeus-extension.json", "skills/gui-execution/SKILL.md", "skills/gui-execution/references/runtime.md"]
